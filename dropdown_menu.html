<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo menu dọc đa cấp (Dropdown Menu)</title>
    <style>
        /* Đặt font chữ cố định cho trang */
        body {
            font-family: Arial, sans-serif;
        }

        /* Bỏ khoảng đệm và lề mặc định của thẻ menu, ul, li */
        #menu, #menu ul, #menu li {
            padding: 0;
            margin: 0;
        }

        /* Định dạng các phần tử trong danh sách (li) */
        #menu li {
            list-style: none;
            position: relative;
            width: 100px;
            height: 30px;
            padding: 0 20px;
            background-color: black;
            line-height: 30px;
            cursor: pointer;
        }

        /* Định dạng liên kết (thẻ a) */
        #menu li a {
            text-decoration: none;
            color: white;
            display: block;
        }

        /* Đổi màu nền khi rê chuột vào mục menu */
        #menu li:hover {
            background-color: red;
        }

        /* Ẩn danh sách con và cố định vị trí hiển thị ở bên phải */
        #menu ul ul {
            position: absolute;
            top: 0;
            left: 140px;
            visibility: hidden;
        }

        /* Hiển thị danh sách con khi rê chuột vào mục cha */
        #menu ul li:hover ul {
            visibility: visible;
        }
    </style>
</head>
<body>

    <h3>ACCP i10</h3>

    <div id="menu">
        <ul>
            <li>
                <a href="#">Sem 1</a>
                <ul>
                    <li><a href="#">Computing Fundamental</a></li>
                    <li><a href="#">C Programming</a></li>
                    <li><a href="#">Building Dynamic Website</a></li>
                    <li><a href="#">MS Transact-SQL</a></li>
                    <li><a href="#">Project</a></li>
                </ul>
            </li>
            <li>
                <a href="#">Sem 2</a>
                <ul>
                    <li><a href="#">Cloud Computing</a></li>
                    <li><a href="#">APJ - I</a></li>
                    <li><a href="#">APJ - II</a></li>
                    <li><a href="#">APJ - III</a></li>
                    <li><a href="#">eProject</a></li>
                </ul>
            </li>
            <li><a href="#">Sem 3</a></li>
            <li><a href="#">Sem 4</a></li>
        </ul>
    </div>

</body>
</html>
