<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành Menu Ngang (Horizontal Dropdown Menu)</title>
    <style>
        /* Định dạng font chữ chung cho trang */
        body {
            font-family: Arial, sans-serif;
        }

        /* Định dạng phân vùng menu chính */
        #menu {
            height: 30px;
            padding: 0;
            margin: 0;
            background-color: #000000;
            border: 1px solid #CDCDCD;
        }

        /* Xóa khoảng đệm và lề mặc định của danh sách */
        #menu ul, #menu li {
            padding: 0;
            margin: 0;
        }

        /* Định dạng các thẻ li menu cha xếp hàng ngang */
        #menu li {
            position: relative;
            float: left;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        /* Định dạng thẻ a cho menu cha */
        #menu li a {
            width: 100px;
            height: 30px;
            display: block;
            text-decoration: none;
            text-align: center;
            line-height: 30px;
            background-color: black;
            color: white;
        }

        /* Định dạng thẻ a cho các mục trong menu con */
        #menu ul ul li a {
            width: 200px;
            text-align: left;
            padding-left: 10px;
        }

        /* Đổi màu nền sang đỏ khi rê chuột qua liên kết */
        #menu li a:hover {
            background-color: red;
        }

        /* Định dạng vị trí và ẩn menu con cấp 2 */
        #menu ul ul {
            position: absolute;
            top: 30px;
            left: 0;
            visibility: hidden;
        }

        /* Hiển thị menu con khi rê chuột vào li cha tương ứng */
        #menu ul li:hover ul {
            visibility: visible;
        }
    </style>
</head>
<body>

    <div id="menu">
        <ul>
            <li>
                <a href="#">Sem 1</a>
                <ul>
                    <li><a href="#">Computing Fundamental</a></li>
                    <li><a href="#">C Programming</a></li>
                    <li><a href="#">Building Dynamic Website</a></li>
                    <li><a href="#">MS Transact-SQL</a></li>
                    <li><a href="#">Project</a></li>
                </ul>
            </li>
            <li>
                <a href="#">Sem 2</a>
                <ul>
                    <li><a href="#">Cloud Computing</a></li>
                    <li><a href="#">APJ - I</a></li>
                    <li><a href="#">APJ - II</a></li>
                    <li><a href="#">APJ - III</a></li>
                    <li><a href="#">eProject</a></li>
                </ul>
            </li>
            <li><a href="#">Sem 3</a></li>
            <li><a href="#">Sem 4</a></li>
        </ul>
    </div>

</body>
</html>
