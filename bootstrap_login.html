<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login với Bootstrap 5</title>

    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-BmbxuPwQa2lc/FVzBcNJ7UAyJxM6wuqIj61tLrc4wSX0szH/Ev+nYRRuWlolflfl" crossorigin="anonymous">

    <style>
        html, body {
            height: 100%;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: 40px;
            padding-bottom: 40px;
            background-color: #f5f5f5;
        }

        .form-signin {
            width: 100%;
            max-width: 330px;
            padding: 15px;
            margin: 0 auto;
        }

        .form-signin .checkbox {
            font-weight: 400;
        }

        .form-signin .form-control {
            position: relative;
            box-sizing: border-box;
            height: auto;
            padding: 10px;
            font-size: 16px;
        }

        .form-signin .form-control:focus {
            z-index: 2;
        }

        .form-signin input[type="email"] {
            margin-bottom: -1px;
            border-bottom-right-radius: 0;
            border-bottom-left-radius: 0;
        }

        .form-signin input[type="password"] {
            margin-bottom: 10px;
            border-top-left-radius: 0;
            border-top-right-radius: 0;
        }
    </style>
</head>
<body class="text-center">

    <form class="form-signin">
        <!-- Logo Bootstrap SVG -->
        <svg class="mb-4" xmlns="http://www.w3.org/2000/svg" width="72" height="72" fill="#6f42c1" class="bi bi-bootstrap-fill" viewBox="0 0 16 16">
            <path d="M6.375 5.27h2.008c.7 0 1.218.17 1.56.508.338.337.507.813.507 1.428 0 .456-.108.835-.325 1.135a1.98 1.98 0 0 1-.852.696v.052c.467.12.839.362 1.116.726.278.364.417.828.417 1.39 0 .688-.204 1.23-.612 1.626-.408.396-.983.594-1.725.594H6.375V5.27zm1.88 2.214h-1.02v1.39h1.02c.312 0 .553-.075.723-.224.17-.15.255-.367.255-.65 0-.285-.083-.501-.25-.648-.166-.148-.41-.222-.728-.222zm.12 2.628h-1.14v1.51h1.14c.348 0 .615-.084.801-.252.186-.168.279-.404.279-.708 0-.304-.09-.54-.27-.708-.18-.168-.444-.252-.792-.252z"/>
            <path d="M4 0a4 4 0 0 0-4 4v8a4 4 0 0 0 4 4h8a4 4 0 0 0 4-4V4a4 4 0 0 0-4-4H4zm10.605 12c0 .332-.06.634-.18.906a2.003 2.003 0 0 1-.497.712 2.03 2.03 0 0 1-.712.497c-.272.12-.574.18-.906.18H4.695a2.03 2.03 0 0 1-.906-.18 2.03 2.03 0 0 1-.712-.497 2.003 2.003 0 0 1-.497-.712 2.03 2.03 0 0 1-.18-.906V4.695c0-.332.06-.634.18-.906a2.03 2.03 0 0 1 .497-.712 2.03 2.03 0 0 1 .712-.497c.272-.12.574-.18.906-.18h6.61c.332 0 .634.06.906.18.272.12.525.286.712.497.187.211.353.464.497.712.12.272.18.574.18.906V12z"/>
        </svg>

        <h1 class="h3 mb-3 font-weight-normal">Please sign in</h1>
        <input type="email" id="inputEmail" class="form-control" placeholder="Email address" required autofocus>
        <input type="password" id="inputPassword" class="form-control" placeholder="Password" required>
        
        <div class="checkbox mb-3">
            <label>
                <input type="checkbox" value="remember-me"> Remember me
            </label>
        </div>
        
        <button class="btn btn-lg btn-primary w-100" type="submit">Sign in</button>
        <p class="mt-5 mb-3 text-muted">&copy; 2017-2026</p>
    </form>

    <!-- Bootstrap JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-b5kHyXgcpbZJO/tY9Ul7kGkf1S0CWuKcCD38l8YkeH8z8QjE0GmW1gYU5S9FOnJ0"
            crossorigin="anonymous"></script>
</body>
</html>
